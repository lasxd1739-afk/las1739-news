name: Cap nhat tin tuc TCVN ASTM
on:
  schedule:
    - cron: '15 1 * * *' # 08:15 theo gio Viet Nam
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cai thu vien
        run: pip install -r requirements.txt
      - name: Lay tin va luu theo ngay
        run: python update_news.py
      - name: Ghi lai JSON khi co thay doi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Cap nhat tin va luu tru $(date -u +%F)"
            git push
          fi
